<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found — Bilal Kahraman</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script>
    // Project Pages sites, such as /karakale/ and /jsonb_slice/, are served
    // by their own repositories. This file handles only paths that do not
    // belong to an active project site. Keep the old game links working.
    const path = location.pathname;
    if (path.startsWith("/wolfenstein/") || path === "/wolfenstein") {
      const moved = "/karakale/" + path.replace(/^\/wolfenstein\/?/, "");
      location.replace(moved + location.search + location.hash);
    }
  </script>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>This address does not match a published page.</p>
    <p><a href="/">Return to the project index</a>.</p>
  </main>
</body>
</html>
